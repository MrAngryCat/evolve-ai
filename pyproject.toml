[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evolve-ai"
dynamic = ["version"]
description = "Local-first Evolve AI: offline foundation"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.setuptools.dynamic]
version = {attr = "evolve.__version__"}

[tool.setuptools.packages.find]
include = ["evolve*"]
